  <circle cx="750" cy="90" r="1.5" fill="#d282ff" opacity="0.4"/>
  <circle cx="900" cy="45" r="1" fill="#bb8fce" opacity="0.25"/>
  <circle cx="1080" cy="70" r="2" fill="#d282ff" opacity="0.35"/>
