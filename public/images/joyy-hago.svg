  <rect x="470" y="318" width="18" height="24" fill="#d282ff" opacity="0.3" rx="1"/>
  <rect x="500" y="323" width="18" height="19" fill="#bb8fce" opacity="0.25" rx="1"/>
  <rect x="470" y="358" width="18" height="24" fill="#d282ff" opacity="0.3" rx="1"/>
