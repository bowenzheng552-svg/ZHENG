<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11071f"/>
      <stop offset="50%" stop-color="#1a0a30"/>
      <stop offset="100%" stop-color="#2d0d4a"/>
    </linearGradient>
    <linearGradient id="bldg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a1a7a"/>
      <stop offset="100%" stop-color="#2a0d4a"/>
    </linearGradient>
    <linearGradient id="bldg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6c2bd9"/>
      <stop offset="100%" stop-color="#3d1a7a"/>
    </linearGradient>
    <linearGradient id="bldg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e44ad"/>
      <stop offset="100%" stop-color="#5b2c6f"/>
    </linearGradient>
    <linearGradient id="highlightR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8e44ad" stop-opacity="0"/>
      <stop offset="100%" stop-color="#d282ff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="glowRight" x1="0.5" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9b59b6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#bb8fce" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="g">
      <feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="600" fill="url(#sky)"/>
  <!-- Particles -->
  <circle cx="150" cy="80" r="2" fill="#d282ff" opacity="0.4"/>
  <circle cx="300" cy="50" r="1.5" fill="#bb8fce" opacity="0.3"/>
