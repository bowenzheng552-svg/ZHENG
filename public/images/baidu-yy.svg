<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#0d2137"/>
      <stop offset="100%" stop-color="#0b2b4a"/>
    </linearGradient>
    <linearGradient id="building1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#0e2e47"/>
    </linearGradient>
    <linearGradient id="building2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2980b9"/>
      <stop offset="100%" stop-color="#1a5a82"/>
    </linearGradient>
    <linearGradient id="building3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f6fa5"/>
      <stop offset="100%" stop-color="#124578"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3498db" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3498db" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3498db" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5dade2" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="600" fill="url(#sky)"/>
  <!-- Stars -->
  <circle cx="100" cy="60" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="250" cy="40" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="400" cy="80" r="1.2" fill="#fff" opacity="0.5"/>
  <circle cx="550" cy="30" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="700" cy="70" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="850" cy="45" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="1050" cy="55" r="1.2" fill="#fff" opacity="0.5"/>
  <!-- YY Logo accent line right side -->
  <rect x="800" y="80" width="2" height="40" fill="#5dade2" opacity="0.5" rx="1"/>
  <rect x="810" y="90" width="2" height="30" fill="#3498db" opacity="0.4" rx="1"/>
  <rect x="820" y="70" width="2" height="50" fill="#85c1e9" opacity="0.3" rx="1"/>
  <!-- Tech building cluster center-right -->
  <rect x="520" y="220" width="80" height="380" fill="url(#building1)" rx="2"/>
  <rect x="530" y="230" width="20" height="30" fill="#5dade2" opacity="0.3" rx="1"/>
  <rect x="560" y="240" width="20" height="20" fill="#3498db" opacity="0.25" rx="1"/>
  <rect x="530" y="280" width="20" height="30" fill="#5dade2" opacity="0.3" rx="1"/>
  <rect x="560" y="290" width="20" height="20" fill="#3498db" opacity="0.25" rx="1"/>
  <rect x="530" y="330" width="20" height="30" fill="#5dade2" opacity="0.3" rx="1"/>
  <rect x="560" y="340" width="20" height="20" fill="#3498db" opacity="0.25" rx="1"/>
  <rect x="530" y="380" width="20" height="30" fill="#5dade2" opacity="0.3" rx="1"/>
  <rect x="560" y="390" width="20" height="20" fill="#3498db" opacity="0.25" rx="1"/>
  <rect x="530" y="430" width="20" height="30" fill="#5dade2" opacity="0.3" rx="1"/>
  <rect x="560" y="440" width="20" height="20" fill="#3498db" opacity="0.25" rx="1"/>
  <!-- Tall building -->
  <rect x="620" y="180" width="60" height="420" fill="url(#building2)" rx="2"/>
  <rect x="628" y="195" width="14" height="22" fill="#85c1e9" opacity="0.4" rx="1"/>
  <rect x="650" y="200" width="14" height="17" fill="#5dade2" opacity="0.35" rx="1"/>
  <rect x="628" y="230" width="14" height="22" fill="#85c1e9" opacity="0.4" rx="1"/>
  <rect x="650" y="235" width="14" height="17" fill="#5dade2" opacity="0.35" rx="1"/>
  <rect x="628" y="270" width="14" height="22" fill="#85c1e9" opacity="0.4" rx="1"/>
  <rect x="650" y="275" width="14" height="17" fill="#5dade2" opacity="0.35" rx="1"/>
  <rect x="628" y="310" width="14" height="22" fill="#85c1e9" opacity="0.4" rx="1"/>
  <rect x="650" y="315" width="14" height="17" fill="#5dade2" opacity="0.35" rx="1"/>
  <rect x="628" y="350" width="14" height="22" fill="#85c1e9" opacity="0.4" rx="1"/>
  <rect x="650" y="355" width="14" height="17" fill="#5dade2" opacity="0.35" rx="1"/>
  <rect x="628" y="390" width="14" height="22" fill="#85c1e9" opacity="0.4" rx="1"/>
  <rect x="650" y="395" width="14" height="17" fill="#5dade2" opacity="0.35" rx="1"/>
  <!-- Mid building -->
  <rect x="700" y="260" width="70" height="340" fill="url(#building3)" rx="2"/>
  <rect x="710" y="270" width="18" height="25" fill="#85c1e9" opacity="0.3" rx="1"/>
  <rect x="738" y="278" width="18" height="17" fill="#5dade2" opacity="0.25" rx="1"/>
  <rect x="710" y="310" width="18" height="25" fill="#85c1e9" opacity="0.3" rx="1"/>
  <rect x="738" y="318" width="18" height="17" fill="#5dade2" opacity="0.25" rx="1"/>
  <rect x="710" y="350" width="18" height="25" fill="#85c1e9" opacity="0.3" rx="1"/>
  <rect x="738" y="358" width="18" height="17" fill="#5dade2" opacity="0.25" rx="1"/>
  <!-- Right-side tech glow -->
  <rect x="880" y="200" width="300" height="400" fill="url(#glow)" opacity="0.2"/>
  <rect x="900" y="100" width="1" height="500" fill="#3498db" opacity="0.06"/>
  <rect x="940" y="140" width="1" height="460" fill="#3498db" opacity="0.04"/>
  <rect x="980" y="80" width="1" height="520" fill="#3498db" opacity="0.05"/>
  <!-- Ground -->
  <rect x="0" y="560" width="1200" height="40" fill="#0a1628" opacity="0.6"/>
  <!-- YY logo hint on right -->
  <circle cx="1050" cy="180" r="40" fill="none" stroke="#3498db" stroke-width="1" opacity="0.15"/>
  <circle cx="1050" cy="180" r="25" fill="none" stroke="#5dade2" stroke-width="0.5" opacity="0.2"/>
  <path d="M1040 175 L1050 165 L1060 175 L1050 195 Z" fill="#3498db" opacity="0.12"/>
</svg>
