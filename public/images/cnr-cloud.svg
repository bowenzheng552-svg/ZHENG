  <path d="M1020 180 Q1060 140 1100 180" fill="none" stroke="#f5d68a" stroke-width="1" opacity="0.1"/>
  <path d="M1010 200 Q1060 150 1110 200" fill="none" stroke="#f5d68a" stroke-width="0.8" opacity="0.08"/>
  <path d="M1000 220 Q1060 160 1120 220" fill="none" stroke="#f5d68a" stroke-width="0.6" opacity="0.06"/>
  <!-- Mic accent right -->
  <rect x="1040" y="250" width="3" height="60" fill="#f5d68a" opacity="0.12" rx="1"/>
