  <rect x="702" y="340" width="15" height="15" fill="#d4a55a" opacity="0.15" rx="1"/>
  <!-- Warm glow right -->
  <rect x="800" y="100" width="400" height="500" fill="url(#signal)"/>
  <rect x="850" y="80" width="350" height="520" fill="url(#glowR)"/>
