  <rect x="670" y="290" width="60" height="310" fill="url(#bldg3)" rx="2"/>
  <rect x="678" y="300" width="15" height="20" fill="#f5d68a" opacity="0.18" rx="1"/>
  <rect x="702" y="305" width="15" height="15" fill="#d4a55a" opacity="0.15" rx="1"/>
