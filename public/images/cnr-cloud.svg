  <rect x="590" y="338" width="20" height="24" fill="#f5d68a" opacity="0.25" rx="1"/>
  <rect x="622" y="343" width="20" height="19" fill="#d4a55a" opacity="0.2" rx="1"/>
  <rect x="590" y="378" width="20" height="24" fill="#f5d68a" opacity="0.25" rx="1"/>
  <rect x="622" y="383" width="20" height="19" fill="#d4a55a" opacity="0.2" rx="1"/>
