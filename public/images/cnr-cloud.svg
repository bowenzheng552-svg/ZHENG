<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0f05"/>
      <stop offset="50%" stop-color="#2d1a08"/>
      <stop offset="100%" stop-color="#3d240a"/>
    </linearGradient>
    <linearGradient id="bldg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b3a1a"/>
      <stop offset="100%" stop-color="#3d1f0a"/>
    </linearGradient>
    <linearGradient id="bldg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="100%" stop-color="#5a2d0d"/>
    </linearGradient>
    <linearGradient id="bldg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0522d"/>
      <stop offset="100%" stop-color="#6b3a1a"/>
    </linearGradient>
    <linearGradient id="glowR" x1="0.5" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a55a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f5d68a" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="warmR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5d68a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f5d68a" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="signal" cx="0.8" cy="0.3" r="0.4">
      <stop offset="0%" stop-color="#f5d68a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f5d68a" stop-opacity="0"/>
    </radialGradient>
    <filter id="sg"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="600" fill="url(#sky)"/>
